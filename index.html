<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FreeChat Pro</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
  <!-- CDN 오타 수정 (all.min.com -> all.min.css) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #1e1e2e;
      --sidebar-bg: #181825;
      --card-bg: #2b2b3d;
      --accent: #89b4fa;
      --my-msg-border: #a6e3a1;
      --other-msg-border: #f38ba8;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --danger: #f38ba8;
    }
    * { box-sizing: border-box; margin:0; padding:0; font-family: 'Noto Sans KR', sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    #offline-overlay {
      position: fixed; top:0; left:0; width:100vw; height:100vh;
      background: rgba(0,0,0,0.85); z-index: 9999; display: none;
      flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    #offline-overlay i { font-size: 50px; color: var(--danger); margin-bottom: 15px; }

    #auth-section, #setup-section {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: var(--bg); z-index: 1000; display: flex;
      justify-content: center; align-items: center;
    }
    .auth-card {
      background: var(--card-bg); padding: 30px; border-radius: 12px;
      width: 90%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .auth-card h2 { margin-bottom: 20px; text-align: center; color: var(--accent); }
    .input-group { margin-bottom: 15px; position: relative; }
    .input-group input {
      width: 100%; padding: 12px; background: var(--bg); border: 1px solid #45475a;
      border-radius: 6px; color: #fff; outline: none;
    }
    .input-group i.pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      cursor: pointer; color: var(--subtext);
    }
    .btn {
      width: 100%; padding: 12px; background: var(--accent); border: none;
      border-radius: 6px; color: #11111b; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    .btn-secondary { background: #45475a; color: #fff; margin-top: 5px; }
    
    #sidebar {
      width: 70px; background: var(--sidebar-bg); display: flex;
      flex-direction: column; align-items: center; padding-top: 20px;
      border-right: 1px solid #313244;
    }
    .nav-btn {
      background: none; border: none; color: var(--subtext); font-size: 20px;
      margin-bottom: 25px; cursor: pointer; transition: 0.2s; position: relative;
    }
    .nav-btn.active, .nav-btn:hover { color: var(--accent); }
    .badge {
      position: absolute; top: -5px; right: -5px; background: var(--danger);
      color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 10px; display: none;
    }

    #main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
    .section { display: none; height: 100%; flex-direction: column; padding: 20px; }
    .section.active { display: flex; }

    .chat-box { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .msg-bar {
      background: var(--card-bg); padding: 10px 14px; border-radius: 6px;
      max-width: 80%; width: fit-content; position: relative; word-break: break-all;
    }
    .msg-bar.my { align-self: flex-end; border-left: 5px solid var(--my-msg-border); }
    .msg-bar.other { align-self: flex-start; border-left: 5px solid var(--other-msg-border); }
    .msg-header { font-size: 11px; color: var(--subtext); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 10px; }
    .msg-text { font-size: 14px; }
    .msg-delete { color: var(--danger); cursor: pointer; margin-left: 8px; font-size: 12px; }
    .msg-media { max-width: 100%; max-height: 250px; border-radius: 6px; margin-top: 5px; display: block; }

    .chat-input-area { display: flex; gap: 10px; padding-top: 10px; border-top: 1px solid #313244; align-items: center; }
    .chat-input-area input[type="text"] {
      flex: 1; padding: 12px; background: var(--card-bg); border: 1px solid #45475a;
      border-radius: 6px; color: #fff; outline: none;
    }
    .chat-input-area .btn { width: auto; padding: 0 20px; height: 43px; margin-top: 0; }
    .file-btn {
      background: var(--card-bg); border: 1px solid #45475a; color: var(--subtext);
      width: 43px; height: 43px; border-radius: 6px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; font-size: 16px; transition: 0.2s;
    }
    .file-btn:hover { color: var(--accent); border-color: var(--accent); }

    .list-item {
      background: var(--card-bg); padding: 12px; border-radius: 6px;
      margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
    }
    .list-item-btn { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; }
    .btn-accept { background: #a6e3a1; color: #11111b; }
    .btn-reject { background: #f38ba8; color: #11111b; }
    .btn-cancel { background: #f9e2af; color: #11111b; }

    .sub-view { display: none; flex-direction: column; height: 100%; }
    .sub-view.active { display: flex; }
    .back-btn { background: none; border: none; color: var(--accent); cursor: pointer; margin-bottom: 10px; font-weight: bold; width: fit-content; }
  </style>
</head>
<body>

  <div id="offline-overlay">
    <i class="fa-solid fa-wifi"></i>
    <h2>인터넷 연결 끊김</h2>
    <p>네트워크 상태를 확인해주세요.</p>
  </div>

  <div id="auth-section">
    <div class="auth-card">
      <h2 id="auth-title">로그인</h2>
      <div class="input-group">
        <input type="email" id="auth-email" placeholder="이메일">
      </div>
      <div class="input-group">
        <input type="password" id="auth-pw" placeholder="비밀번호">
        <i class="fa-solid fa-eye pw-toggle" onclick="togglePassword('auth-pw', this)"></i>
      </div>
      <button class="btn" id="auth-main-btn" onclick="handleAuth()">로그인</button>
      <button class="btn btn-secondary" id="auth-sub-btn" onclick="toggleAuthMode()">회원가입으로 이동</button>
    </div>
  </div>

  <div id="setup-section" style="display: none;">
    <div class="auth-card">
      <h2>초기 프로필 설정</h2>
      <div class="input-group">
        <input type="text" id="setup-nick" placeholder="닉네임">
      </div>
      <div class="input-group">
        <input type="text" id="setup-id" placeholder="고유 아이디 (@없이 입력)">
      </div>
      <button class="btn" onclick="saveInitialProfile()">설정 완료</button>
    </div>
  </div>

  <div id="sidebar">
    <button class="nav-btn active" onclick="changeTab('chat', this)"><i class="fa-solid fa-comments"></i></button>
    <button class="nav-btn" onclick="changeTab('friends', this)">
      <i class="fa-solid fa-user-group"></i>
      <span id="friend-req-badge" class="badge">0</span>
    </button>
    <button class="nav-btn" onclick="changeTab('groups', this)"><i class="fa-solid fa-users"></i></button>
    <button class="nav-btn" onclick="changeTab('search', this)"><i class="fa-solid fa-magnifying-glass"></i></button>
    <button class="nav-btn" onclick="changeTab('profile', this)"><i class="fa-solid fa-gear"></i></button>
  </div>

  <div id="main-content">
    
    <!-- 광장 탭 -->
    <div id="tab-chat" class="section active">
      <h3>전체 광장</h3>
      <div id="public-chat-box" class="chat-box"></div>
      <div class="chat-input-area">
        <label class="file-btn" for="public-file-input"><i class="fa-solid fa-paperclip"></i></label>
        <input type="file" id="public-file-input" accept="image/*,video/*" style="display:none;" onchange="uploadFileAndSend('public', this)">
        <input type="text" id="public-msg-input" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter' && !event.isComposing) sendMsg()">
        <button class="btn" onclick="sendMsg()">전송</button>
      </div>
    </div>

    <!-- 친구 탭 -->
    <div id="tab-friends" class="section">
      <div id="friends-main-view">
        <div id="requests-wrapper" style="display:none; margin-bottom: 20px;">
          <h4>받은 친구 요청</h4>
          <div id="requests-list"></div>
        </div>
        <h4>친구 목록</h4>
        <div id="friends-list"></div>
      </div>

      <div id="dm-view" class="sub-view">
        <button class="back-btn" onclick="closeDM()"><i class="fa-solid fa-arrow-left"></i> 목록으로</button>
        <h3 id="dm-target-name"></h3>
        <div id="dm-chat-box" class="chat-box"></div>
        <div class="chat-input-area">
          <label class="file-btn" for="dm-file-input"><i class="fa-solid fa-paperclip"></i></label>
          <input type="file" id="dm-file-input" accept="image/*,video/*" style="display:none;" onchange="uploadFileAndSend('dm', this)">
          <input type="text" id="dm-msg-input" placeholder="메시지..." onkeydown="if(event.key==='Enter' && !event.isComposing) sendDMMsg()">
          <button class="btn" onclick="sendDMMsg()">전송</button>
        </div>
      </div>
    </div>

    <!-- 그룹 탭 -->
    <div id="tab-groups" class="section">
      <div id="groups-main-view">
        <button class="btn" style="margin-bottom:15px;" onclick="showCreateGroupModal()">+ 새 그룹 만들기</button>
        <div id="create-group-modal" style="display:none; background: var(--card-bg); padding:15px; border-radius:6px; margin-bottom:15px;">
          <input type="text" id="group-name-input" placeholder="그룹 이름" style="width:100%; padding:8px; margin-bottom:10px; background:var(--bg); border:1px solid #45475a; color:#fff; border-radius:4px;">
          <p style="font-size:12px; color:var(--subtext); margin-bottom:5px;">초대할 친구 선택:</p>
          <div id="group-friends-select" style="max-height:100px; overflow-y:auto; margin-bottom:10px;"></div>
          <button class="btn" onclick="createGroup()">생성</button>
        </div>
        <h4>내 그룹 채팅방</h4>
        <div id="groups-list"></div>
      </div>

      <div id="group-chat-view" class="sub-view">
        <div style="display:flex; justify-content: space-between; align-items:center;">
          <button class="back-btn" onclick="closeGroupChat()"><i class="fa-solid fa-arrow-left"></i> 목록으로</button>
          <button class="btn-reject list-item-btn" onclick="leaveGroup()">그룹 탈퇴</button>
        </div>
        <h3 id="group-target-name"></h3>
        <div id="group-chat-box" class="chat-box"></div>
        <div class="chat-input-area">
          <label class="file-btn" for="group-file-input"><i class="fa-solid fa-paperclip"></i></label>
          <input type="file" id="group-file-input" accept="image/*,video/*" style="display:none;" onchange="uploadFileAndSend('group', this)">
          <input type="text" id="group-msg-input" placeholder="메시지..." onkeydown="if(event.key==='Enter' && !event.isComposing) sendGroupMsg()">
          <button class="btn" onclick="sendGroupMsg()">전송</button>
        </div>
      </div>
    </div>

    <!-- 검색 탭 -->
    <div id="tab-search" class="section">
      <h3>사용자 검색</h3>
      <div class="input-group" style="margin-top:15px;">
        <input type="text" id="search-input" placeholder="@아이디 또는 닉네임 검색" onkeyup="searchUsers()">
      </div>
      <div id="search-results"></div>
    </div>

    <!-- 프로필/설정 탭 -->
    <div id="tab-profile" class="section">
      <h3>프로필 설정</h3>
      <div style="margin-top: 20px;">
        <div class="input-group">
          <label style="font-size:12px; color:var(--subtext);">닉네임</label>
          <input type="text" id="profile-nick-input">
        </div>
        <button class="btn" onclick="updateNick()">닉네임 변경</button>
        
        <div class="input-group" style="margin-top: 20px;">
          <label style="font-size:12px; color:var(--subtext);">고유 아이디 (7일마다 변경 가능)</label>
          <input type="text" id="profile-id-input">
        </div>
        <button class="btn" onclick="updateID()">아이디 변경</button>

        <button class="btn btn-secondary" style="margin-top: 40px; background:var(--danger); color:#fff;" onclick="logout()">로그아웃</button>
      </div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForTemplatePurposesOnly",
      authDomain: "freechat-pro.firebaseapp.com",
      projectId: "freechat-pro",
      storageBucket: "freechat-pro.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    const ADMIN_EMAIL = "danwoo5235@gmail.com";

    let currentUser = null;
    let currentUserDoc = null;
    let isAuthModeLogin = true;
    let activeDMId = null;
    let activeGroupId = null;

    let publicUnsub = null, dmUnsub = null, groupUnsub = null;

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists) {
          currentUserDoc = userDoc.data();
          document.getElementById('auth-section').style.display = 'none';
          document.getElementById('setup-section').style.display = 'none';
          initApp();
        } else {
          document.getElementById('auth-section').style.display = 'none';
          document.getElementById('setup-section').style.display = 'flex';
        }
      } else {
        currentUser = null;
        currentUserDoc = null;
        document.getElementById('auth-section').style.display = 'flex';
        document.getElementById('setup-section').style.display = 'none';
      }
    });

    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if(input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function toggleAuthMode() {
      isAuthModeLogin = !isAuthModeLogin;
      document.getElementById('auth-title').innerText = isAuthModeLogin ? '로그인' : '회원가입';
      document.getElementById('auth-main-btn').innerText = isAuthModeLogin ? '로그인' : '회원가입';
      document.getElementById('auth-sub-btn').innerText = isAuthModeLogin ? '회원가입으로 이동' : '로그인으로 이동';
    }

    async function handleAuth() {
      const email = document.getElementById('auth-email').value.trim();
      const pw = document.getElementById('auth-pw').value.trim();
      if(!email || !pw) return alert('이메일과 비밀번호를 입력해주세요.');

      try {
        if(isAuthModeLogin) {
          await auth.signInWithEmailAndPassword(email, pw);
        } else {
          await auth.createUserWithEmailAndPassword(email, pw);
        }
      } catch(err) {
        alert(err.message);
      }
    }

    async function saveInitialProfile() {
      const nick = document.getElementById('setup-nick').value.trim();
      const customId = document.getElementById('setup-id').value.trim().replace('@','');

      if(!nick || !customId) return alert('모든 항목을 입력해주세요.');

      const idCheck = await db.collection('users').where('customId', '==', customId).get();
      if(!idCheck.empty) return alert('이미 사용 중인 아이디입니다.');

      const userData = {
        uid: currentUser.uid,
        email: currentUser.email,
        nick: nick,
        customId: customId,
        lastIdUpdate: firebase.firestore.FieldValue.serverTimestamp()
      };

      await db.collection('users').doc(currentUser.uid).set(userData);
      currentUserDoc = userData;
      document.getElementById('setup-section').style.display = 'none';
      initApp();
    }

    // event 참조 오류 수정
    function changeTab(tabName, btnElem) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(`tab-${tabName}`).classList.add('active');
      if (btnElem) btnElem.classList.add('active');

      if(tabName === 'friends') closeDM();
      if(tabName === 'groups') closeGroupChat();
    }

    function initApp() {
      loadPublicMsgs();
      listenToRequests();
      loadFriendsList();
      loadGroupsList();
      document.getElementById('profile-nick-input').value = currentUserDoc.nick;
      document.getElementById('profile-id-input').value = currentUserDoc.customId;
    }

    function formatFullDate(ts) {
      if(!ts) return '';
      const date = ts.toDate ? ts.toDate() : new Date(ts);
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      let hours = date.getHours();
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? '오후' : '오전';
      hours = hours % 12;
      hours = hours ? hours : 12;
      return `${yyyy}년 ${mm}월 ${dd}일 ${ampm} ${hours}:${minutes}`;
    }

    function renderMsg(doc, boxId, colName) {
      const data = doc.data();
      const isMy = data.uid === currentUser.uid;
      const isAdmin = currentUser.email === ADMIN_EMAIL;
      
      const div = document.createElement('div');
      div.className = `msg-bar ${isMy ? 'my' : 'other'}`;
      
      let deleteBtnHtml = '';
      if (isMy || isAdmin) {
        deleteBtnHtml = `<span class="msg-delete" onclick="deleteMsg('${colName}', '${doc.id}')"><i class="fa-solid fa-trash"></i></span>`;
      }

      let contentHtml = '';
      if(data.fileUrl) {
        if(data.fileType === 'image') {
          contentHtml = `<img src="${data.fileUrl}" class="msg-media" alt="사진">`;
        } else if(data.fileType === 'video') {
          contentHtml = `<video src="${data.fileUrl}" controls class="msg-media"></video>`;
        }
      } else {
        contentHtml = `<div class="msg-text">${data.text || ''}</div>`;
      }

      div.innerHTML = `
        <div class="msg-header">
          <span>${data.nick} (@${data.customId})</span>
          <span>${formatFullDate(data.createdAt)} ${deleteBtnHtml}</span>
        </div>
        ${contentHtml}
      `;
      return div;
    }

    async function deleteMsg(colName, docId) {
      if(confirm('메시지를 삭제하시겠습니까?')) {
        await db.collection(colName).doc(docId).delete();
      }
    }

    async function uploadFileAndSend(type, inputElem) {
      const file = inputElem.files[0];
      if(!file) return;

      const fileType = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : null;
      if(!fileType) return alert('이미지 또는 동영상 파일만 업로드 가능합니다.');

      try {
        const storageRef = storage.ref(`chat_files/${Date.now()}_${file.name}`);
        const snapshot = await storageRef.put(file);
        const downloadURL = await snapshot.ref.getDownloadURL();

        const msgData = {
          uid: currentUser.uid,
          nick: currentUserDoc.nick,
          customId: currentUserDoc.customId,
          fileUrl: downloadURL,
          fileType: fileType,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if(type === 'public') {
          await db.collection('public_chat').add(msgData);
        } else if(type === 'dm') {
          msgData.roomId = activeDMId;
          await db.collection('dm_chats').add(msgData);
        } else if(type === 'group') {
          msgData.groupId = activeGroupId;
          await db.collection('group_chats').add(msgData);
        }
        inputElem.value = '';
      } catch(err) {
        alert('파일 업로드 실패: ' + err.message);
      }
    }

    function loadPublicMsgs() {
      if(publicUnsub) publicUnsub();
      publicUnsub = db.collection('public_chat').orderBy('createdAt', 'asc')
        .onSnapshot(snapshot => {
          const box = document.getElementById('public-chat-box');
          box.innerHTML = '';
          snapshot.forEach(doc => {
            box.appendChild(renderMsg(doc, 'public-chat-box', 'public_chat'));
          });
          box.scrollTop = box.scrollHeight;
        });
    }

    async function sendMsg() {
      const input = document.getElementById('public-msg-input');
      const text = input.value.trim();
      if(!text) return;
      input.value = '';

      await db.collection('public_chat').add({
        uid: currentUser.uid,
        nick: currentUserDoc.nick,
        customId: currentUserDoc.customId,
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    async function searchUsers() {
      const q = document.getElementById('search-input').value.trim();
      const resContainer = document.getElementById('search-results');
      resContainer.innerHTML = '';
      if(!q) return;

      const snapshot = await db.collection('users').get();
      snapshot.forEach(doc => {
        const data = doc.data();
        if(data.uid === currentUser.uid) return;

        if(data.nick.includes(q) || data.customId.includes(q)) {
          const item = document.createElement('div');
          item.className = 'list-item';
          item.innerHTML = `
            <div>
              <strong>${data.nick}</strong> (@${data.customId})
            </div>
            <div id="search-btn-${data.uid}">
              <button class="list-item-btn btn-accept" onclick="sendFriendReq('${data.uid}')">친구 요청</button>
            </div>
          `;
          resContainer.appendChild(item);
          checkFriendshipStatus(data.uid);
        }
      });
    }

    async function checkFriendshipStatus(targetUid) {
      const btnDiv = document.getElementById(`search-btn-${targetUid}`);
      if(!btnDiv) return;

      const friendDoc = await db.collection('users').doc(currentUser.uid).collection('friends').doc(targetUid).get();
      if(friendDoc.exists) {
        btnDiv.innerHTML = `<span style="font-size:12px; color:var(--subtext);">친구임</span>`;
        return;
      }

      const reqSent = await db.collection('friend_requests')
        .where('from', '==', currentUser.uid).where('to', '==', targetUid).get();
      if(!reqSent.empty) {
        const reqId = reqSent.docs[0].id;
        btnDiv.innerHTML = `<button class="list-item-btn btn-cancel" onclick="cancelFriendReq('${reqId}', '${targetUid}')">요청 취소</button>`;
        return;
      }

      const reqReceived = await db.collection('friend_requests')
        .where('from', '==', targetUid).where('to', '==', currentUser.uid).get();
      if(!reqReceived.empty) {
        btnDiv.innerHTML = `<span style="font-size:12px; color:var(--accent);">요청 받음</span>`;
      }
    }

    async function sendFriendReq(targetUid) {
      await db.collection('friend_requests').add({
        from: currentUser.uid,
        to: targetUid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      searchUsers();
    }

    async function cancelFriendReq(reqId, targetUid) {
      await db.collection('friend_requests').doc(reqId).delete();
      searchUsers();
    }

    function listenToRequests() {
      db.collection('friend_requests').where('to', '==', currentUser.uid)
        .onSnapshot(async snapshot => {
          const badge = document.getElementById('friend-req-badge');
          const wrapper = document.getElementById('requests-wrapper');
          const list = document.getElementById('requests-list');
          
          if(snapshot.empty) {
            badge.style.display = 'none';
            wrapper.style.display = 'none';
            return;
          }

          badge.innerText = snapshot.size;
          badge.style.display = 'inline-block';
          wrapper.style.display = 'block';
          list.innerHTML = '';

          for(let doc of snapshot.docs) {
            const reqData = doc.data();
            const senderDoc = await db.collection('users').doc(reqData.from).get();
            const sender = senderDoc.data();

            const item = document.createElement('div');
            item.className = 'list-item';
            item.innerHTML = `
              <div><strong>${sender.nick}</strong> (@${sender.customId})</div>
              <div>
                <button class="list-item-btn btn-accept" onclick="acceptFriend('${doc.id}', '${sender.uid}')">수락</button>
                <button class="list-item-btn btn-reject" onclick="rejectFriend('${doc.id}')">거절</button>
              </div>
            `;
            list.appendChild(item);
          }
        });
    }

    async function acceptFriend(reqId, senderUid) {
      await db.collection('users').doc(currentUser.uid).collection('friends').doc(senderUid).set({ createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      await db.collection('users').doc(senderUid).collection('friends').doc(currentUser.uid).set({ createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      await db.collection('friend_requests').doc(reqId).delete();
      loadFriendsList();
    }

    async function rejectFriend(reqId) {
      await db.collection('friend_requests').doc(reqId).delete();
    }

    function loadFriendsList() {
      db.collection('users').doc(currentUser.uid).collection('friends')
        .onSnapshot(async snapshot => {
          const list = document.getElementById('friends-list');
          list.innerHTML = '';

          for(let doc of snapshot.docs) {
            const friendUid = doc.id;
            const friendDoc = await db.collection('users').doc(friendUid).get();
            if(!friendDoc.exists) continue;
            const friend = friendDoc.data();

            const item = document.createElement('div');
            item.className = 'list-item';
            item.style.cursor = 'pointer';
            item.onclick = () => openDM(friendUid, friend.nick);
            item.innerHTML = `<div><strong>${friend.nick}</strong> (@${friend.customId})</div>`;
            list.appendChild(item);
          }
        });
    }

    function openDM(friendUid, friendNick) {
      activeDMId = [currentUser.uid, friendUid].sort().join('_');
      document.getElementById('friends-main-view').style.display = 'none';
      document.getElementById('dm-view').classList.add('active');
      document.getElementById('dm-target-name').innerText = friendNick;

      if(dmUnsub) dmUnsub();
      dmUnsub = db.collection('dm_chats')
        .where('roomId', '==', activeDMId)
        .orderBy('createdAt', 'asc')
        .onSnapshot(snapshot => {
          const box = document.getElementById('dm-chat-box');
          box.innerHTML = '';
          snapshot.forEach(doc => {
            box.appendChild(renderMsg(doc, 'dm-chat-box', 'dm_chats'));
          });
          box.scrollTop = box.scrollHeight;
        });
    }

    function closeDM() {
      if(dmUnsub) dmUnsub();
      activeDMId = null;
      document.getElementById('dm-view').classList.remove('active');
      document.getElementById('friends-main-view').style.display = 'block';
    }

    async function sendDMMsg() {
      const input = document.getElementById('dm-msg-input');
      const text = input.value.trim();
      if(!text || !activeDMId) return;
      input.value = '';

      await db.collection('dm_chats').add({
        roomId: activeDMId,
        uid: currentUser.uid,
        nick: currentUserDoc.nick,
        customId: currentUserDoc.customId,
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    async function showCreateGroupModal() {
      const modal = document.getElementById('create-group-modal');
      const selectDiv = document.getElementById('group-friends-select');
      modal.style.display = modal.style.display === 'none' ? 'block' : 'none';
      selectDiv.innerHTML = '';

      const snapshot = await db.collection('users').doc(currentUser.uid).collection('friends').get();
      for(let doc of snapshot.docs) {
        const friendDoc = await db.collection('users').doc(doc.id).get();
        const friend = friendDoc.data();
        selectDiv.innerHTML += `
          <div>
            <input type="checkbox" value="${friend.uid}" class="group-friend-checkbox"> ${friend.nick} (@${friend.customId})
          </div>
        `;
      }
    }

    async function createGroup() {
      const name = document.getElementById('group-name-input').value.trim();
      if(!name) return alert('그룹 이름을 입력하세요.');

      const checkboxes = document.querySelectorAll('.group-friend-checkbox:checked');
      const members = [currentUser.uid];
      checkboxes.forEach(cb => members.push(cb.value));

      if(members.length < 2) return alert('최소 한 명 이상의 친구를 선택하세요.');

      await db.collection('groups').add({
        name: name,
        members: members,
        createdBy: currentUser.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      document.getElementById('group-name-input').value = '';
      document.getElementById('create-group-modal').style.display = 'none';
    }

    // Firestore array-contains 구문 수정
    function loadGroupsList() {
      db.collection('groups').where('members', 'array-contains', currentUser.uid)
        .onSnapshot(snapshot => {
          const list = document.getElementById('groups-list');
          list.innerHTML = '';
          snapshot.forEach(doc => {
            const group = doc.data();
            const item = document.createElement('div');
            item.className = 'list-item';
            item.style.cursor = 'pointer';
            item.onclick = () => openGroupChat(doc.id, group.name);
            item.innerHTML = `<div><strong>${group.name}</strong> (${group.members.length}명)</div>`;
            list.appendChild(item);
          });
        });
    }

    function openGroupChat(groupId, groupName) {
      activeGroupId = groupId;
      document.getElementById('groups-main-view').style.display = 'none';
      document.getElementById('group-chat-view').classList.add('active');
      document.getElementById('group-target-name').innerText = groupName;

      if(groupUnsub) groupUnsub();
      groupUnsub = db.collection('group_chats')
        .where('groupId', '==', activeGroupId)
        .orderBy('createdAt', 'asc')
        .onSnapshot(snapshot => {
          const box = document.getElementById('group-chat-box');
          box.innerHTML = '';
          snapshot.forEach(doc => {
            box.appendChild(renderMsg(doc, 'group-chat-box', 'group_chats'));
          });
          box.scrollTop = box.scrollHeight;
        });
    }

    function closeGroupChat() {
      if(groupUnsub) groupUnsub();
      activeGroupId = null;
      document.getElementById('group-chat-view').classList.remove('active');
      document.getElementById('groups-main-view').style.display = 'block';
    }

    async function sendGroupMsg() {
      const input = document.getElementById('group-msg-input');
      const text = input.value.trim();
      if(!text || !activeGroupId) return;
      input.value = '';

      await db.collection('group_chats').add({
        groupId: activeGroupId,
        uid: currentUser.uid,
        nick: currentUserDoc.nick,
        customId: currentUserDoc.customId,
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    async function leaveGroup() {
      if(!activeGroupId || !confirm('정말 이 그룹을 탈퇴하시겠습니까?')) return;
      await db.collection('groups').doc(activeGroupId).update({
        members: firebase.firestore.FieldValue.arrayRemove(currentUser.uid)
      });
      closeGroupChat();
    }

    async function updateNick() {
      const newNick = document.getElementById('profile-nick-input').value.trim();
      if(!newNick) return alert('닉네임을 입력하세요.');

      await db.collection('users').doc(currentUser.uid).update({ nick: newNick });
      currentUserDoc.nick = newNick;
      alert('닉네임이 변경되었습니다.');
    }

    async function updateID() {
      const newId = document.getElementById('profile-id-input').value.trim().replace('@','');
      if(!newId) return alert('아이디를 입력하세요.');

      if(currentUserDoc.lastIdUpdate) {
        const lastUpdate = currentUserDoc.lastIdUpdate.toDate();
        const now = new Date();
        const diffDays = (now - lastUpdate) / (1000 * 60 * 60 * 24);
        if(diffDays < 7) {
          return alert(`아이디는 7일에 한 번만 변경 가능합니다. (남은 일수: ${Math.ceil(7 - diffDays)}일)`);
        }
      }

      const idCheck = await db.collection('users').where('customId', '==', newId).get();
      if(!idCheck.empty) return alert('이미 사용 중인 아이디입니다.');

      await db.collection('users').doc(currentUser.uid).update({
        customId: newId,
        lastIdUpdate: firebase.firestore.FieldValue.serverTimestamp()
      });
      currentUserDoc.customId = newId;
      alert('아이디가 변경되었습니다.');
    }

    function logout() {
      auth.signOut();
    }

    window.addEventListener('online', () => {
      document.getElementById('offline-overlay').style.display = 'none';
    });
    window.addEventListener('offline', () => {
      document.getElementById('offline-overlay').style.display = 'flex';
    });
  </script>
</body>
</html>
